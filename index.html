<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UMB Division • Railway Operations Dashboard</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f1f5f9; color: #0f172a; }
    .topbar { background: linear-gradient(135deg, #0f172a, #1e3a8a); color: #fff; padding: 1.2rem 2rem; }
    .topbar-inner { max-width: 1280px; margin: auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; }
    .topbar h1 { margin: 0; font-size: 1.3rem; }
    .topbar p { margin: 0.25rem 0 0; font-size: 0.85rem; color: #93c5fd; }
    .container { max-width: 1280px; margin: 1.5rem auto; padding: 0 1.25rem; }
    .panel, .card { background: #fff; padding: 1.25rem; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 1.25rem; }
    .panel { display: flex; flex-wrap: wrap; gap: 1rem; }
    .field { display: flex; flex-direction: column; gap: 0.3rem; flex: 1; min-width: 170px; }
    .field label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; color: #64748b; }
    select, input { padding: 0.5rem 0.75rem; font-size: 0.9rem; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.25rem; }
    .kpi { background: #fff; padding: 1rem 1.25rem; border-radius: 10px; border: 1px solid #e2e8f0; border-left: 4px solid #2563eb; }
    .kpi small { font-size: 0.75rem; font-weight: 700; color: #64748b; text-transform: uppercase; }
    .kpi div { font-size: 1.55rem; font-weight: 700; margin: 0.25rem 0; }
    .card-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid #e2e8f0; }
    .btn { border: 1px solid #cbd5e1; background: #f8fafc; padding: 0.35rem 0.8rem; border-radius: 6px; font-weight: 600; cursor: pointer; }
    .btn.active { background: #2563eb; color: #fff; border-color: #2563eb; }
    .bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; }
    .bar-lbl { width: 170px; font-size: 0.85rem; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .bar-bg { flex: 1; background: #e2e8f0; height: 22px; border-radius: 5px; overflow: hidden; }
    .bar-fill { height: 100%; background: #2563eb; transition: width 0.3s; }
    .bar-val { width: 105px; text-align: right; font-size: 0.85rem; font-weight: 700; }
    .tbl-wrap { overflow-x: auto; max-height: 450px; border: 1px solid #e2e8f0; border-radius: 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
    th, td { padding: 0.55rem 0.75rem; border-bottom: 1px solid #e2e8f0; white-space: nowrap; text-align: left; }
    th { background: #f8fafc; position: sticky; top: 0; font-weight: 700; }
    tr.sum td { background: #eff6ff; font-weight: 700; color: #1e3a8a; }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>Ambala Division (UMB) • Freight & Operations Portal</h1>
        <p id="status">Loading dashboard...</p>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="panel">
      <div class="field"><label>1. Report / Sheet</label><select id="sheetSel"></select></div>
      <div class="field"><label>2. Sub-Table / Period</label><select id="secSel"></select></div>
      <div class="field"><label>3. Category / Date (X)</label><select id="xSel"></select></div>
      <div class="field"><label>4. Metric (Y)</label><select id="ySel"></select></div>
    </div>

    <div class="kpis" id="kpiBox"></div>

    <div class="card">
      <div class="card-top">
        <h3 id="chartTitle" style="margin:0;">Chart</h3>
        <div>
          <button class="btn active" id="bBar" onclick="setMode('bar')">Bar Graph</button>
          <button class="btn" id="bLine" onclick="setMode('line')">Trend Line</button>
        </div>
      </div>
      <div id="chartBox"></div>
    </div>

    <div class="card">
      <div class="card-top">
        <h3 id="tblTitle" style="margin:0;">Records</h3>
        <input type="text" id="qInput" placeholder="Search rows...">
      </div>
      <div class="tbl-wrap" id="tblBox"></div>
    </div>
  </div>

  <script>
    var SHEETS = [
      { label: "Earning", file: "data.csv-Earning.csv" },
      { label: "Loading 25-26", file: "data.csv-LOADING-25-26.csv" },
      { label: "Loading 26-27", file: "data.csv-LOADING-26-27.csv" },
      { label: "Loading Comparison", file: "data.csv-loading comparison.csv" },
      { label: "Interchange", file: "data.csv-INTERCHANGE.csv" },
      { label: "Lead", file: "data.csv-Load.csv" },
      { label: "Loco Utilization", file: "data.csv-Loco Utilization.csv" },
      { label: "Long Haul & Crack", file: "data.csv-Long Haul & Crack.csv" },
      { label: "NTKM Originating", file: "data.csv-NTKM ORIGINATING.csv" },
      { label: "NTKM Per Wagon Day", file: "data.csv-NTKM PER WAGON DAY.csv" },
      { label: "Running Train KM", file: "data.csv-RUNNING TRAIN KM.csv" },
      { label: "Rail Co-efficient", file: "data.csv-Rail Co-efficient.csv" },
      { label: "Rake, MT, Wagon Comp 2025-26", file: "data.csv-Rake, MT, Wagon Comp 2025-26.csv" },
      { label: "Rake, MT, Wagon Comp 2026-27", file: "data.csv-Rake, MT, Wagon Comp 2026-27.csv" },
      { label: "GTD, WTR, PVT, INEFF 25-26", file: "data.csv-GTD, WTR, PVT, INEFF-25-26.csv" },
      { label: "GTD, WTR, PVT, INEFF 26-27", file: "data.csv-GTD, WTR, PVT, INEFF-26-27.csv" },
      { label: "Wagon Holding", file: "data.csv-Wagon Holding.csv" },
      { label: "WKM Per Wagon Day", file: "data.csv-WKM PER WAGON DAY.csv" },
      { label: "WTR", file: "data.csv-WTR.csv" },
      { label: "Weight MT", file: "data.csv-weight MT.csv" },
      { label: "Weight MT Previous Year", file: "data.csv-Weight MT previous Year.csv" },
      { label: "Speed", file: "data.csv-speed.csv" },
      { label: "Index", file: "data.csv-INDEX.csv" }
    ];

    var sheetSel = document.getElementById('sheetSel'), secSel = document.getElementById('secSel');
    var xSel = document.getElementById('xSel'), ySel = document.getElementById('ySel'), qInput = document.getElementById('qInput');
    var sections = [], curSec = null, mode = 'bar';

    function pick(arr, idx) { return arr.slice(idx, idx + 1).shift(); }
    SHEETS.forEach(function(s) { sheetSel.add(new Option(s.label, s.file)); });

    function parseCSV(text) {
      var rows = [], row = [], cell = '', q = false;
      for (var i = 0; i < text.length; i++) {
        var ch = text.charAt(i), nx = text.charAt(i + 1);
        if (ch === '"' && q && nx === '"') { cell += '"'; i++; }
        else if (ch === '"') { q = !q; }
        else if (ch === ',' && !q) { row.push(cell.trim()); cell = ''; }
        else if ((ch === '\n' || ch === '\r') && !q) {
          if (ch === '\r' && nx === '\n') i++;
          row.push(cell.trim()); rows.push(row); row = []; cell = '';
        } else { cell += ch; }
      }
      if (cell || row.length) { row.push(cell.trim()); rows.push(row); }
      return rows;
    }

    function toNum(v) {
      var s = String(v == null ? '' : v).trim();
      if (!s || s.indexOf('#') === 0 || s.indexOf('/') !== -1) return NaN;
      var n = Number(s.replace(/,/g, '').replace(/%/g, ''));
      return isNaN(n) ? NaN : n;
    }

    function buildSections(rows) {
      var blocks = [], blk = [], title = '';
      rows.forEach(function(r) {
        var filled = r.filter(function(c) { return c !== '' && c.indexOf('#') !== 0; });
        if (filled.length === 0) {
          if (blk.length >= 2) { blocks.push({ title: title, rows: blk }); blk = []; title = ''; }
        } else if (filled.length === 1 && blk.length === 0) {
          title = pick(filled, 0);
        } else { blk.push(r); }
      });
      if (blk.length >= 2) blocks.push({ title: title, rows: blk });

      return blocks.map(function(b, idx) {
        var hIdx = b.rows.findIndex(function(r) { return r.filter(function(c) { return c !== ''; }).length >= 2; });
        if (hIdx < 0) hIdx = 0;
        if (!b.title && hIdx > 0) b.title = pick(b.rows[hIdx - 1].filter(function(c) { return c !== ''; }), 0) || '';

        var rawH = b.rows[hIdx], cols = [], seen = {};
        var maxC = Math.max.apply(null, b.rows.slice(hIdx).map(function(r) { return r.length; }));
        for (var c = 0; c < maxC; c++) {
          if ((rawH[c] || '') !== '' || b.rows.slice(hIdx + 1).some(function(r) { return (r[c] || '') !== ''; })) cols.push(c);
        }
        var headers = cols.map(function(ci, i) {
          var nm = (rawH[ci] || (i === 0 ? 'Category' : 'Col ' + (ci + 1))).replace(/\s+/g, ' ').trim();
          seen[nm] = (seen[nm] || 0) + 1;
          return seen[nm] > 1 ? nm + ' (' + seen[nm] + ')' : nm;
        });
        var records = b.rows.slice(hIdx + 1).filter(function(r) { return r.some(function(c) { return c !== ''; }); }).map(function(r) {
          var o = {};
          cols.forEach(function(ci, i) { var v = r[ci] || ''; o[headers[i]] = v.indexOf('#') === 0 ? '—' : v; });
          return o;
        });
        return { label: b.title || ('Table ' + (idx + 1) + ' (' + headers.slice(1, 3).join(', ') + ')'), headers: headers, records: records };
      }).filter(function(s) { return s.records.length > 0; });
    }

    function loadFile(file) {
      document.getElementById('status').innerText = 'Loading ' + file + '...';
      fetch('./' + encodeURIComponent(file) + '?t=' + Date.now())
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function(txt) {
          sections = buildSections(parseCSV(txt));
          secSel.innerHTML = '';
          sections.forEach(function(s, i) { secSel.add(new Option(s.label, i)); });
          document.getElementById('status').innerText = 'Loaded: ' + file + ' (' + sections.length + ' tables)';
          if (sections.length) pickSection(0);
        })
        .catch(function(e) { document.getElementById('status').innerText = 'Error: ' + e.message; });
    }

    function pickSection(i) {
      curSec = sections[i];
      xSel.innerHTML = ''; ySel.innerHTML = '';
      curSec.headers.forEach(function(h) { xSel.add(new Option(h, h)); ySel.add(new Option(h, h)); });
      xSel.value = curSec.headers.find(function(h) { return /date|month|commodity|period/i.test(h); }) || pick(curSec.headers, 0);
      ySel.value = curSec.headers.find(function(h) {
        return !/s\.?no|sr\s*no/i.test(h) && curSec.records.some(function(r) { return !isNaN(toNum(r[h])); });
      }) || pick(curSec.headers, 1) || pick(curSec.headers, 0);
      draw();
    }

    function isSum(row, xCol) {
      var s = (Object.keys(row).slice(0, 2).map(function(k) { return row[k]; }).join(' ') + ' ' + (row[xCol] || '')).toLowerCase();
      return /\b(total|avg|average|upto)\b/.test(s);
    }

    function setMode(m) {
      mode = m;
      document.getElementById('bBar').classList.toggle('active', m === 'bar');
      document.getElementById('bLine').classList.toggle('active', m === 'line');
      draw();
    }

    function draw() {
      if (!curSec) return;
      var xCol = xSel.value, yCol = ySel.value;
      var pts = curSec.records.filter(function(r) { return !isSum(r, xCol); })
        .map(function(r) { return { l: r[xCol] || '—', v: toNum(r[yCol]) }; })
        .filter(function(d) { return !isNaN(d.v); });

      var fmt = function(n) { return n.toLocaleString('en-IN', { maximumFractionDigits: 2 }); };
      if (pts.length) {
        var sum = pts.reduce(function(a, b) { return a + b.v; }, 0);
        var pk = pts.reduce(function(a, b) { return b.v > a.v ? b : a; }, pick(pts, 0));
        document.getElementById('kpiBox').innerHTML =
          '<div class="kpi"><small>Total (' + yCol + ')</small><div>' + fmt(sum) + '</div></div>' +
          '<div class="kpi" style="border-left-color:#0d9488"><small>Average</small><div>' + fmt(sum / pts.length) + '</div></div>' +
          '<div class="kpi" style="border-left-color:#d97706"><small>Peak (' + pk.l + ')</small><div>' + fmt(pk.v) + '</div></div>';
      } else { document.getElementById('kpiBox').innerHTML = ''; }

      document.getElementById('chartTitle').innerText = yCol + ' by ' + xCol;
      var cBox = document.getElementById('chartBox');
      if (!pts.length) { cBox.innerHTML = '<p style="color:#64748b">Select a numeric column in <b>4. Metric (Y)</b>.</p>'; }
      else if (mode === 'bar') {
        var max = Math.max.apply(null, pts.map(function(d) { return Math.abs(d.v); }).concat(1));
        cBox.innerHTML = pts.map(function(d) {
          var w = Math.min(100, (Math.abs(d.v) / max) * 100);
          return '<div class="bar-row"><div class="bar-lbl" title="' + d.l + '">' + d.l + '</div>' +
                 '<div class="bar-bg"><div class="bar-fill" style="width:' + w + '%;background:' + (d.v < 0 ? '#dc2626' : '#2563eb') + '"></div></div>' +
                 '<div class="bar-val">' + fmt(d.v) + '</div></div>';
        }).join('');
      } else {
        var W = 900, H = 250, pL = 60, pR = 20, pT = 20, pB = 40, pw = W - pL - pR, ph = H - pT - pB;
        var minV = Math.min.apply(null, pts.map(function(d) { return d.v; }).concat(0));
        var maxV = Math.max.apply(null, pts.map(function(d) { return d.v; }).concat(1));
        var coords = pts.map(function(d, i) {
          return { x: pL + (pts.length === 1 ? pw / 2 : (i / (pts.length - 1)) * pw), y: pT + ph - ((d.v - minV) / ((maxV - minV) || 1)) * ph, l: d.l, v: d.v };
        });
        var path = coords.map(function(p, i) { return (i ? 'L' : 'M') + p.x.toFixed(1) + ',' + p.y.toFixed(1); }).join(' ');
        var dots = coords.map(function(p) { return '<circle cx="' + p.x + '" cy="' + p.y + '" r="4" fill="#1d4ed8"><title>' + p.l + ': ' + fmt(p.v) + '</title></circle>'; }).join('');
        var st = Math.ceil(coords.length / 8);
        var lbls = coords.filter(function(_, i) { return i % st === 0; }).map(function(p) { return '<text x="' + p.x + '" y="' + (H - 10) + '" font-size="11" text-anchor="middle" fill="#64748b">' + p.l + '</text>'; }).join('');
        cBox.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto"><line x1="' + pL + '" y1="' + (pT + ph) + '" x2="' + (W - pR) + '" y2="' + (pT + ph) + '" stroke="#cbd5e1"/><text x="' + (pL - 6) + '" y="' + (pT + 5) + '" font-size="11" text-anchor="end" fill="#64748b">' + fmt(maxV) + '</text><path d="' + path + '" fill="none" stroke="#2563eb" stroke-width="2.5"/>' + dots + lbls + '</svg>';
      }

      var q = qInput.value.toLowerCase();
      var rows = q ? curSec.records.filter(function(r) { return curSec.headers.some(function(h) { return String(r[h]).toLowerCase().indexOf(q) !== -1; }); }) : curSec.records;
      document.getElementById('tblTitle').innerText = 'Records (' + rows.length + ' rows)';
      document.getElementById('tblBox').innerHTML = '<table><thead><tr>' + curSec.headers.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
        rows.map(function(r) { return '<tr class="' + (isSum(r, xCol) ? 'sum' : '') + '">' + curSec.headers.map(function(h) { return '<td>' + (r[h] || '') + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
    }

    sheetSel.onchange = function() { loadFile(sheetSel.value); };
    secSel.onchange = function() { pickSection(Number(secSel.value)); };
    xSel.onchange = draw; ySel.onchange = draw; qInput.oninput = draw;
    loadFile(pick(SHEETS, 0).file);
  </script>
</body>
</html>
